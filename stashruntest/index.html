<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stashrun Test</title>
  <style>
    :root{
      --black:#020300;
      --lime:#cfff17;
      --logo:url("https://static.wixstatic.com/media/6700cb_9e4878f1369347799ceabf3ceb6a6af8~mv2.png");
      --wordmark:url("https://static.wixstatic.com/media/6700cb_9a66b736a8544b0385b25958fa12c3bf~mv2.png");
      --bigS:url("https://static.wixstatic.com/media/09212f_b036251f2ba74bb186a0c454ef2a8822~mv2.png");
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:var(--black);overflow:hidden}
    body{min-height:100svh;font-family:Arial,Helvetica,sans-serif}

    .screen{
      position:relative;
      width:100vw;
      height:100svh;
      min-height:720px;
      max-width:560px;
      margin:0 auto;
      background:radial-gradient(circle at 50% 48%,rgba(90,105,0,.08),transparent 46%),#020300;
      overflow:hidden;
      isolation:isolate;
    }

    /* Big background S */
    .screen::before{
      content:"";
      position:absolute;
      left:-39%;top:-8%;
      width:178%;height:122%;
      background-image:var(--bigS);
      background-repeat:no-repeat;
      background-position:center center;
      background-size:contain;
      opacity:.47;
      filter:brightness(.55) sepia(1) hue-rotate(22deg) saturate(4.6);
      z-index:0;
      pointer-events:none;
    }

    header{
      position:absolute;top:0;left:0;right:0;
      z-index:3;height:128px;
      display:flex;align-items:flex-start;justify-content:space-between;
      padding:63px 36px 0 36px;
    }

    .logo{
      width:58px;height:58px;
      background-image:var(--logo);
      background-repeat:no-repeat;
      background-size:contain;
      background-position:center;
    }

    .hamburger{width:42px;display:grid;gap:8px;padding-top:12px;opacity:.72}
    .hamburger span{
      display:block;height:4px;border-radius:999px;
      background:rgba(255,255,255,.78);
      box-shadow:0 0 8px rgba(255,255,255,.12);
    }

    .hero{
      position:absolute;left:0;right:0;top:0;bottom:0;
      z-index:2;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
      padding-bottom:23.5svh;
    }

    .wordmark{
      width:85.5vw;max-width:500px;height:86px;
      background-image:var(--wordmark);
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      filter:brightness(0) invert(1) drop-shadow(0 2px 2px rgba(255,255,255,.14));
    }

    /* CSS chevron arrow */
    .arrow{position:relative;width:54px;height:88px;margin-top:54px}
    .arrow::before{
      content:"";position:absolute;left:50%;top:0;
      width:4px;height:65px;
      transform:translateX(-50%);
      background:var(--lime);
      box-shadow:0 0 10px rgba(207,255,23,.25);
    }
    .arrow::after{
      content:"";position:absolute;left:50%;bottom:9px;
      width:28px;height:28px;
      border-right:4px solid var(--lime);
      border-bottom:4px solid var(--lime);
      transform:translateX(-50%) rotate(45deg);
      box-shadow:4px 4px 8px rgba(207,255,23,.10);
    }

    /* Lime arc at bottom */
    .bottom-arc{
      position:absolute;left:-15%;right:-15%;bottom:-56px;
      height:105px;
      border-top:3px solid var(--lime);
      border-radius:50% 50% 0 0 / 100% 100% 0 0;
      z-index:4;opacity:.96;
      box-shadow:0 -1px 8px rgba(207,255,23,.18);
      pointer-events:none;
    }

    @media (min-width:561px){body{background:#020300}.wordmark{width:480px}}

    @media (max-width:430px){
      .screen{max-width:none;min-height:100svh}
      header{padding:58px 35px 0 35px;height:122px}
      .wordmark{width:86vw;height:82px}
      .hero{padding-bottom:23.4svh}
      .arrow{margin-top:51px}
      .screen::before{left:-41%;top:-7%;width:181%;height:122%;opacity:.48}
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Stashrun landing page">
    <header>
      <div class="logo" aria-label="Stashrun logo"></div>
      <div class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </div>
    </header>

    <section class="hero">
      <div class="wordmark" role="img" aria-label="STASHRUN"></div>
      <div class="arrow" aria-hidden="true"></div>
    </section>

    <div class="bottom-arc" aria-hidden="true"></div>
  </main>
</body>
</html>
